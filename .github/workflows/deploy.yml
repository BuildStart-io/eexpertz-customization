name: Deploy BuildStart Frontend

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_SUPABASE_URL: https://supabase.buildstart.io
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: selfhosted
        run: |
          cd frontend
          npm run build

      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "nginx/app.buildstart.io.conf"
          target: "/tmp/buildstart-nginx"

      - name: Deploy Frontend to Nginx Web Root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend/dist/**"
          target: "${{ secrets.FRONTEND_WEB_ROOT || '/var/www/app.buildstart.io' }}"
          strip_components: 2

      - name: Configure Nginx and Install SSL Certificate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            FRONTEND_WEB_ROOT="${{ secrets.FRONTEND_WEB_ROOT || '/var/www/app.buildstart.io' }}"
            
            # Ensure the web root folder exists and has correct ownership
            sudo mkdir -p $FRONTEND_WEB_ROOT
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} $FRONTEND_WEB_ROOT
            
            # Copy Nginx config file to site-available and enable it
            sudo cp /tmp/buildstart-nginx/nginx/app.buildstart.io.conf /etc/nginx/sites-available/
            sudo ln -sf /etc/nginx/sites-available/app.buildstart.io.conf /etc/nginx/sites-enabled/
            
            # Test Nginx syntax and reload
            sudo nginx -t
            sudo systemctl reload nginx || true
            
            # Install Certbot if it's not present on the server
            if ! command -v certbot &> /dev/null; then
              sudo apt-get update && sudo apt-get install certbot python3-certbot-nginx -y
            fi
            
            # Automatically request/install SSL certificate and configure redirect
            sudo certbot --nginx -d app.buildstart.io --non-interactive --agree-tos --email "${{ secrets.SSL_EMAIL || 'admin@buildstart.io' }}" --redirect --reinstall --keep-until-expiring
            
            # Final Nginx reload to ensure everything is live
            sudo systemctl reload nginx || true
            
            # Clean up temp folder
            rm -rf /tmp/buildstart-nginx
